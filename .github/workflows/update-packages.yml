name: Update Packages

on:
  schedule:
    # GitHub Actions schedules are UTC. This checks once per hour.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update package pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix develop -c packages/codex/update.py
          nix develop -c packages/oh-my-codex/update.py

      - name: Validate flake evaluation
        run: nix flake check --all-systems --no-build --print-build-logs

      - name: Build OMX package smoke
        run: nix build .#oh-my-codex --print-build-logs

      - name: Commit and push if packages changed
        run: |
          if git diff --quiet; then
            echo "All tracked packages are already up to date."
            exit 0
          fi

          changed_files="$(git diff --name-only)"
          codex_version="$(nix eval .#codex.version --raw)"
          omx_version="$(nix eval .#oh-my-codex.version --raw)"

          git add packages/codex/hashes.json packages/oh-my-codex/hashes.json packages/oh-my-codex/Cargo.lock flake.lock

          if grep -q '^packages/codex/' <<< "$changed_files" && grep -q '^packages/oh-my-codex/' <<< "$changed_files"; then
            message="update codex to ${codex_version} and omx to ${omx_version}"
          elif grep -q '^packages/oh-my-codex/' <<< "$changed_files"; then
            message="omx: update to ${omx_version}"
          else
            message="codex: update to ${codex_version}"
          fi

          git commit -m "$message"
          git push
