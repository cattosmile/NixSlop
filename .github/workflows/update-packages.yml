name: Update Packages

on:
  schedule:
    # GitHub Actions schedules are UTC. Run once per day because a full Codex
    # and OMX build takes about an hour and more frequent runs provide little
    # value for this personal binary cache.
    - cron: '17 3 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure NixSlop binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixslop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare update branch
        env:
          BRANCH: update/packages
        run: |
          git fetch origin main

          if git fetch origin "$BRANCH"; then
            echo "Reusing existing branch $BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git rebase origin/main; then
              echo "::warning::Rebase of $BRANCH onto main failed; discarding stale update branch"
              git rebase --abort
              git reset --hard origin/main
            fi
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Update package pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix flake update codex-desktop-linux
          nix flake update opencode
          nix develop -c packages/codex/update.py
          nix develop -c packages/kimi-code/update.py
          nix develop -c packages/oh-my-codex/update.py

      - name: Validate flake evaluation
        run: nix flake check --all-systems --no-build --print-build-logs

      - name: Build and smoke test cached packages
        run: |
          codex_path="$(nix build --no-link --print-out-paths .#codex --print-build-logs)"
          codex_desktop_path="$(nix build --no-link --print-out-paths .#codex-desktop --print-build-logs)"
          kimi_path="$(nix build --no-link --print-out-paths .#kimi-code --print-build-logs)"
          opencode_path="$(nix build --no-link --print-out-paths .#opencode --print-build-logs)"
          omx_path="$(nix build --no-link --print-out-paths .#oh-my-codex --print-build-logs)"

          test -x "$codex_path/bin/codex"
          test -x "$codex_desktop_path/bin/codex-desktop"
          test -x "$kimi_path/bin/kimi"
          test -x "$opencode_path/bin/opencode"
          test -x "$omx_path/bin/omx"
          "$codex_path/bin/codex" --version
          "$kimi_path/bin/kimi" --version
          "$opencode_path/bin/opencode" --version
          "$omx_path/bin/omx" --version

      - name: Create or update package update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: update/packages
        run: |
          changed_files="$(git diff --name-only)"

          if [ -n "$changed_files" ]; then
            codex_version="$(nix eval .#codex.version --raw)"
            codex_desktop_version="$(nix eval .#codex-desktop.version --raw)"
            kimi_version="$(nix eval .#kimi-code.version --raw)"
            opencode_version="$(nix eval .#opencode.version --raw)"
            omx_version="$(nix eval .#oh-my-codex.version --raw)"

            git add \
              packages/codex/hashes.json \
              packages/kimi-code/hashes.json \
              packages/oh-my-codex/hashes.json \
              packages/oh-my-codex/Cargo.lock \
              flake.lock

            message="update package pins"
            title="codex: ${codex_version}, desktop: ${codex_desktop_version}, kimi: ${kimi_version}, opencode: ${opencode_version}, omx: ${omx_version}"

            git commit -m "$message"
          else
            codex_version="$(nix eval .#codex.version --raw)"
            codex_desktop_version="$(nix eval .#codex-desktop.version --raw)"
            kimi_version="$(nix eval .#kimi-code.version --raw)"
            opencode_version="$(nix eval .#opencode.version --raw)"
            omx_version="$(nix eval .#oh-my-codex.version --raw)"
            title="package updates"
          fi

          if git diff --quiet origin/main...HEAD; then
            echo "All tracked packages are already up to date."
            exit 0
          fi

          git push --force-with-lease origin "HEAD:$BRANCH"

          pr_number="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')"
          body="$(cat <<EOF
          Automated package update for NixSlop.

          Validated in this workflow:
          - nix flake check --all-systems --no-build --print-build-logs
          - nix build .#codex .#codex-desktop .#kimi-code .#opencode .#oh-my-codex --print-build-logs
          - codex --version
          - codex-desktop executable exists
          - kimi --version
          - opencode --version
          - omx --version

          Binary cache:
          - https://nixslop.cachix.org

          Current evaluated versions:
          - codex: ${codex_version}
          - codex-desktop: ${codex_desktop_version}
          - kimi-code: ${kimi_version}
          - opencode: ${opencode_version}
          - oh-my-codex: ${omx_version}
          EOF
          )"

          if [ -n "$pr_number" ]; then
            echo "Updating existing PR #$pr_number"
            gh pr edit "$pr_number" --title "$title" --body "$body"
          else
            echo "Creating package update PR"
            gh label create dependencies --color 0366d6 --description "Dependency updates" || true
            gh label create automated --color cfd3d7 --description "Automated changes" || true
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body "$body" \
              --label dependencies \
              --label automated
            pr_number="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')"
          fi

          if [ -n "$pr_number" ]; then
            gh pr merge "$pr_number" --auto --squash || \
              echo "::warning::Could not enable auto-merge for PR #$pr_number. Enable repository auto-merge or merge the green PR manually."
          fi
