name: Update Kimi Code

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nixslop-update-global
  queue: max
  cancel-in-progress: false

jobs:
  update:
    name: Run Kimi Code update
    uses: ./.github/workflows/update-reusable.yml
    with:
      program: kimi-code
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
