name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Nix
        id: install_nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure NixSlop binary cache
        id: configure_cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixslop

      - name: Run Python contract tests
        id: python_contracts
        run: python3 -m unittest discover -s tests -v

      - name: Evaluate flake without building
        id: evaluate_flake
        run: nix flake check --all-systems --no-build --print-build-logs

      - name: Build module and desktop package checks
        id: build_contract_checks
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.module-contracts \
            .#checks.x86_64-linux.output-contracts \
            .#checks.x86_64-linux.home-manager-contracts \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.actionlint \
            .#checks.x86_64-linux.workflow-contracts \
            .#checks.x86_64-linux.chatgpt-desktop-contract \
            --print-build-logs

  build:
    name: Build and smoke test ${{ matrix.package }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex
          - chatgpt-desktop
          - oh-my-codex
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Nix
        id: install_nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure NixSlop binary cache
        id: configure_cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixslop

      - name: Build and smoke test package
        id: build_and_smoke
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          package_path="$(nix build --no-link --print-out-paths ".#$PACKAGE" --print-build-logs)"

          case "$PACKAGE" in
            codex)
              "$package_path/bin/codex" --version
              ;;
            chatgpt-desktop)
              test -x "$package_path/bin/chatgpt"
              test -x "$package_path/bin/codex-desktop"
              test -f "$package_path/share/applications/chatgpt.desktop"
              ;;
            oh-my-codex)
              "$package_path/bin/omx" --version
              ;;
            *)
              echo "::error::No smoke test is defined for $PACKAGE"
              exit 1
              ;;
          esac
