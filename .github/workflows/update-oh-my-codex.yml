name: Update oh-my-codex

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nixslop-update-global
  queue: max
  cancel-in-progress: false

jobs:
  update:
    name: Run oh-my-codex update
    uses: ./.github/workflows/update-reusable.yml
    with:
      program: oh-my-codex
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
