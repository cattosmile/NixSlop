paths:
  .github/workflows/update-{codex,codex-desktop,kimi-code,opencode,oh-my-codex,foundations}.yml:
    ignore:
      # GitHub supports extended pending retention with `queue: max`; actionlint 1.7.12
      # still validates the older two-key concurrency schema.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
